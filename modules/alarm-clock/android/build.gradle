plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.alarmclock'
version = '0.1.0'

android {
  namespace "expo.modules.alarmclock"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'androidx.activity:activity-ktx:1.9.3'
  testImplementation 'junit:junit:4.13.2'
}
